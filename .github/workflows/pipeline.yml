# Alternative to running on your own PC (see scripts/setup_task_scheduler.ps1
# for the primary, local method). This runs the pipeline on GitHub's
# infrastructure every 3 hours instead, so it works even when your PC is off.
#
# IMPORTANT CAVEAT: GitHub Actions runners are ephemeral — there's no
# persistent disk between runs. This workflow restores/saves data/job_radar.db
# via actions/cache as a pragmatic way to make SQLite work here, but that's
# not a great long-term pattern (cache entries can be evicted, and this
# isn't true durable storage). If you actually want to run this in GitHub
# Actions long-term, switch DATABASE_URL to a free-tier hosted Postgres
# (e.g. Supabase, Neon) instead — the app already supports any SQLAlchemy
# URL, so it's a one-line config change, not a code change.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   PUSHOVER_USER_KEY, PUSHOVER_APP_TOKEN  (only if you want phone alerts from here)

name: Job Radar Pipeline

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}  # manual "Run workflow" button in the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore job database cache
        uses: actions/cache@v4
        with:
          path: data/job_radar.db
          key: job-radar-db-${{ github.run_id }}
          restore-keys: |
            job-radar-db-

      - name: Run pipeline
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          ENABLE_NOTIFICATIONS: ${{ secrets.PUSHOVER_USER_KEY != '' && 'true' || 'false' }}
        run: python run_pipeline.py

      - name: Upload database as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-radar-db
          path: data/job_radar.db
          retention-days: 7
