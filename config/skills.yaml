# Normalized skill dictionary. Each top-level key is the canonical skill name.
# "aliases" are alternate spellings/phrasings seen in resumes or job descriptions
# that should be folded into the canonical name during matching.
# "category" groups skills for scoring combinations (see config/settings.yaml).
#
# This is not "every word in the resume" — only skills explicitly vetted here
# are used for matching. Add new skills deliberately, don't auto-harvest nouns.

