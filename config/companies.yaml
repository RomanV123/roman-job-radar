# Seed company registry.
#
# Schema for each entry:
#   - name: Display name
#     industry: free-text category (biotech, cybersecurity, ot, energy, semiconductor, technology, government, ...)
#     ats_type: greenhouse | lever | ashby | workday | government | custom
#     board_identifier: the token used in the ATS's public API URL
#       (for workday, this is the tenant — see custom_config below)
#     careers_url: official careers page (used for government/custom sources)
#     priority: 1 (poll hourly) | 2 (poll every 3h) | 3 (discovery queue, not yet implemented)
#     active: true | false
#     custom_config: optional dict, used by the workday/government/custom collectors
#       (see src/collectors/workday.py, government.py, and custom_page.py)
#
# 157 entries below were verified LIVE against real APIs (not guessed): 139
# against the public Greenhouse/Lever/Ashby APIs, and 18 against Workday's
# internal CXS search endpoint (see src/collectors/workday.py for why that
# one needs a tenant + wd_host + site rather than just a board token).
# Priority 1 = California biotech, cybersecurity, OT/industrial,
# semiconductor employers most relevant to Roman's background. Priority 2 =
# broader national tech/cloud employers, polled less frequently.
#
# How to add a company yourself:
#   Greenhouse: https://boards-api.greenhouse.io/v1/boards/<guess>/jobs
#   Lever:      https://api.lever.co/v0/postings/<guess>?mode=json
#   Ashby:      https://api.ashbyhq.com/posting-api/job-board/<guess>
#   Workday:    POST https://<tenant>.wd<1-5>.myworkdayjobs.com/wday/cxs/<tenant>/<site>/jobs
#               with body {"appliedFacets":{},"limit":1,"offset":0,"searchText":""} —
#               tenant/site aren't guessable from the company name alone; check
#               the actual careers page's network requests for the real values.
# A 200 response with real job data confirms the identifiers.
# See README.md for a fuller walkthrough (added in Phase 14).

