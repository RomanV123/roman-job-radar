# --- Review queue: known-important employers NOT yet configured ---
#
# These appear in Roman's background or target-employer list but did not
# resolve against the public Greenhouse/Lever/Ashby/Workday APIs above —
# they likely use SuccessFactors, iCIMS, Phenom, or a custom careers system
# (or, for state/local government, no public JSON API at all). Rather than
# guess and silently 404 forever, they're left out of `companies` until
# someone confirms the actual ATS and adds a `custom` or `government` entry:
#
#   Direct resume employers: California Air Resources Board, UC Davis
#     (state/UC HR portals, not Workday — no public JSON API found)
#   Biotech/pharma: Genentech (confirmed Phenom People, not Workday), BioMarin,
#     Illumina, Danaher, Bio-Rad Laboratories, Beckman Coulter, Cepheid, GRAIL,
#     ResMed, Ionis Pharmaceuticals, Halozyme Therapeutics, ACADIA Pharmaceuticals,
#     Intuitive Surgical, Align Technology, Masimo, Tandem Diabetes Care
#   Cybersecurity: SentinelOne, CyberArk, Rapid7, Tenable, Fortinet, Check Point,
#     Mandiant, Claroty, Forescout, Securonix, eSentire
#   Semiconductor: Arm, Synopsys
#   Other tech: Box, Slack, HashiCorp, DigitalOcean, Automation Anywhere
#   OT/industrial: AVEVA, Bloom Energy, Sunrun, Oklo, Commonwealth Fusion Systems
#   National labs / government: Lawrence Livermore National Laboratory, Sandia
#     National Laboratories, SLAC, California Department of Technology —
#     see src/collectors/government.py docstring for why CalCareers/state
#     agencies aren't wired up yet (no stable public JSON API found).
#
# To add one: confirm its careers page, identify the ATS (view page source
# or network tab for a Greenhouse/Lever/Ashby/Workday API call), then add
# an entry with ats_type: custom (+ custom_config selectors) or leave a
# comment here if it needs a collector type this project doesn't support yet.
